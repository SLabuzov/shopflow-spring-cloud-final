eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true # ← Использовать IP вместо hostname

server:
  port: 8082
  shutdown: graceful

spring:
  application:
    name: order-service
  config:
    import: optional:configserver:.
  cloud:
    config:
      discovery:
        enabled: true
        serviceId: config-server
