services:
  postgres:
    image: postgres:17-alpine
    container_name: infra-db-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:shopflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:shopflow}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infrastructure/init-databases.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"

volumes:
  postgres-data:
